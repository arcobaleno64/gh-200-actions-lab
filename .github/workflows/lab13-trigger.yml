name: lab13-trigger

on:
  workflow_dispatch:

permissions:
  issues: write
  actions: write

jobs:
  fire:
    runs-on: ubuntu-latest
    steps:
      - name: Open an issue with GITHUB_TOKEN (target listens to issues opened)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          url=$(curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -d '{"title":"lab13 issue opened by GITHUB_TOKEN"}' "https://api.github.com/repos/$REPO/issues" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('html_url'), d.get('number'))")
          echo "RESULT13 trigger issue-created=[$url]"
      - name: Dispatch the target workflow with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -d '{"ref":"main"}' "https://api.github.com/repos/$REPO/actions/workflows/lab13-target.yml/dispatches")
          echo "RESULT13 trigger dispatch-http=[$code]"
