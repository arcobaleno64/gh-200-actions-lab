name: lab06-outcome

on:
  workflow_dispatch:

permissions: {}

jobs:
  steps-demo:
    runs-on: ubuntu-latest
    env:
      # secrets is not allowed in if, so pass it through env. The secret is deliberately not set.
      HAS_TOKEN: ${{ secrets.LAB06_NOT_SET != '' }}
    steps:
      - name: lint (fails but continue-on-error)
        id: lint
        continue-on-error: true
        run: exit 1
      - name: print outcome and conclusion
        env:
          OUTCOME: ${{ steps.lint.outcome }}
          CONCLUSION: ${{ steps.lint.conclusion }}
        run: echo "outcome=$OUTCOME conclusion=$CONCLUSION"
      - name: if outcome == failure
        if: steps.lint.outcome == 'failure'
        run: echo ran-outcome-is-failure
      - name: if conclusion == failure
        if: steps.lint.conclusion == 'failure'
        run: echo ran-conclusion-is-failure
      - name: if conclusion == success
        if: steps.lint.conclusion == 'success'
        run: echo ran-conclusion-is-success
      - name: if env.HAS_TOKEN == 'true' (secret unset)
        if: env.HAS_TOKEN == 'true'
        run: echo ran-token-present
      - name: print HAS_TOKEN
        run: echo "HAS_TOKEN=[$HAS_TOKEN]"
