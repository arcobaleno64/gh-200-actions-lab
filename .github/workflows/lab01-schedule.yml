name: lab01-schedule

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - name: Print event context
        env:
          EVENT_NAME: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          echo "RESULT1 event_name=[$EVENT_NAME] cron=[$CRON] sha=[$GITHUB_SHA] ref=[$GITHUB_REF] now=[$(date -u +%Y-%m-%dT%H:%M:%S)]"
