# Copy to .github/workflows/lab01-schedule.yml on the branch lab01-schedule (see LABS.md, lab 1).
name: lab01-schedule

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - name: Print event context
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "event_name=$EVENT_NAME"
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "GITHUB_REF=$GITHUB_REF"
          date -u
